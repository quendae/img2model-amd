[package]
name = "img2model-amd"
version = "0.1.1"
edition = "2021"

[lib]
name = "img2model_amd_lib"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "img2model-amd"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true, features = ["protocol-asset"] }
tauri-plugin-dialog = { version = "2", optional = true }
