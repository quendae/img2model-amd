              "        textured_mesh = pipeline(mesh, image=image)\n        inference_ms = (time.perf_counter() - inference_started) * 1000.0\n\n        output_path.parent.mkdir(parents=True, exist_ok=True)",
              "        textured_mesh = pipeline(mesh, image=image)\n        inference_ms = (time.perf_counter() - inference_started) * 1000.0\n\n        style_preset = str(getattr(args, 'style_preset', 'match-source'))\n        style_strength = float(getattr(args, 'style_strength', 1.0))\n        preserve_source_colors = bool(getattr(args, 'preserve_source_colors', True))\n        style_reference = getattr(args, 'style_reference', None)\n        if not 0.0 <= style_strength <= 1.0:\n            raise ValueError('Texture style strength must be between 0.0 and 1.0')\n\n        if style_preset != 'match-source' and style_strength > 0.0:\n            emit(\n                'progress',\n                ok=True,\n                stage='stylizing_texture',\n                progress=0.88,\n                style_preset=style_preset,\n                style_strength=style_strength,\n            )\n            stylize_started = time.perf_counter()\n            reference_image = None\n            if style_reference:\n                reference_path = Path(style_reference).expanduser().resolve()\n                if not reference_path.is_file():\n                    raise FileNotFoundError(f'Style reference does not exist: {reference_path}')\n                with Image.open(reference_path) as reference_source:\n                    reference_image = reference_source.convert('RGBA')\n            textured_mesh = apply_texture_style_to_mesh(\n                textured_mesh,\n                preset=style_preset,\n                strength=style_strength,\n                preserve_source_colors=preserve_source_colors,\n                reference_image=reference_image,\n            )\n            stylization_ms = (time.perf_counter() - stylize_started) * 1000.0\n\n        output_path.parent.mkdir(parents=True, exist_ok=True)",
