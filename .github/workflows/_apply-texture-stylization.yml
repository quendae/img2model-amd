name: Apply functional texture stylization

on:
  push:
    branches:
      - feat/game-ready-mesh-cleanup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/game-ready-mesh-cleanup
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/dev/apply_texture_stylization.py
      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply functional texture stylization"
          git push origin HEAD:feat/game-ready-mesh-cleanup
