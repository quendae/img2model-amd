              "          stylePreset,\n          styleStrength: request.styleStrength ?? 1.0,\n          preserveSourceColors: request.preserveSourceColors ?? true,\n          styleReference: request.styleReference ?? null,\n          maxFaces: request.maxFaces,",
          )
          replace(
