name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - feat/game-ready-mesh-cleanup
    tags:
      - 'v*'

jobs:
  inno:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Prepare installer payload
        run: npm --workspace @img2model/desktop run prepare-installer

      - name: Validate installer PowerShell
        shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content scripts/setup/install-img2model-runtime.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content scripts/setup/windows-native-rocm.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content scripts/setup/windows-hunyuan-texture.ps1 -Raw))

      - name: Build Tauri application without bundler
        shell: powershell
        run: |
          Set-Location apps/desktop
          npx tauri build --no-bundle

      - name: Build Inno Setup installer
        shell: powershell
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe was not found at $iscc"
          }
          & $iscc "/DMyAppVersion=$version" "apps\desktop\src-tauri\windows\img2model-amd.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup build failed with exit code $LASTEXITCODE"
          }

      - name: Upload setup executable
        uses: actions/upload-artifact@v4
        with:
          name: Img2Model-AMD-Windows-Inno-Setup
          path: apps/desktop/src-tauri/windows/output/*.exe
          if-no-files-found: error
